name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm binutils qemu-system-x86 ovmf xorriso mtools
      - name: Check dependencies
        run: ./scripts/check-deps.sh
      - name: Build
        run: make all
      - name: Boot smoke test (AHCI)
        run: BOOT_TEST_TIMEOUT=45s make test
      - name: Boot smoke test (USB / xHCI)
        # Attaches the data disk only over USB, forcing the root mount through
        # the xHCI + Bulk-Only Transport + SCSI stack (asserts the USB mount).
        run: BOOT_TEST_USB=1 BOOT_TEST_TIMEOUT=45s make boot-test
